{% extends 'base.html' %}

{% block title %}
    Review {{ product.name }}
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>
        Review {{ product.name }}
    </h1>

    <p>
        Share your experience with this product.
    </p>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn"
        >
            Submit Review
        </button>

        <a
            href="{% url 'product_detail' product.id %}"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
