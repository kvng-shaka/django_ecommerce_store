{% extends 'base.html' %}

{% block title %}
    Edit Review
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>
        Edit Your Review
    </h1>

    <p>
        Update your review for {{ review.product.name }}.
    </p>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn"
        >
            Save Changes
        </button>

        <a
            href="{% url 'product_detail' review.product.id %}"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
