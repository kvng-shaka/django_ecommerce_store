{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            My Store
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <header>

        <nav>

            <a href="{% url 'product_list' %}">
                My Store
            </a>

            <a href="{% url 'product_list' %}">
                Products
            </a>

            <a href="{% url 'cart_detail' %}">
                🛒 Cart
            </a>


            {% if user.is_authenticated %}

                <span>
                    Welcome, {{ user.username }}
                </span>

                <a href="{% url 'profile' %}">
                    My Account
                </a>

                <a href="{% url 'order_list' %}">
                    My Orders
                </a>

                <a href="{% url 'wishlist' %}">
                    ❤️ Wishlist
                </a>

                <form method="POST" action="{% url 'logout' %}" style="display: inline;">

                    {% csrf_token %}

                    <button type="submit">
                        Logout
                    </button>

                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </nav>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            &copy; 2026 My Store
        </p>

    </footer>

</body>

</html>
